name: Sync upstream

on:
  schedule:
    - cron: "23 04 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcphub
          fetch-depth: 0
      - name: Mirror upstream and prepare a reviewable update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/googlarz/signal-mcp.git
          git fetch --no-tags upstream main
          git push origin upstream/main:refs/heads/upstream --force
          git checkout -B sync/upstream origin/mcphub
          git merge --no-edit upstream/main
          if git diff --quiet origin/mcphub..HEAD; then exit 0; fi
          git push origin sync/upstream --force
          if [ "$(gh pr list --base mcphub --head sync/upstream --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --base mcphub --head sync/upstream --title "chore: sync upstream" --body "Automated upstream sync. Review and merge after MCPHub validation."
          fi
